<!DOCTYPE html><html data-dir="calida"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
</head><body style="margin:0;padding:24px;background:var(--c-white);font-family:var(--font-sans);">
<div id="root" style="max-width:420px;"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { Field, Input, Textarea } = window.CrecerPsicologia;
const { Checkbox, Radio } = window.CrecerPsicologia;
const { Toggle } = window.CrecerPsicologia;
function Demo(){const [on,setOn]=React.useState(true);return(<div style={{display:'flex',flexDirection:'column',gap:4}}>
<Field label="Nombre" required hint="Como querés que te llamemos"><Input placeholder="Tu nombre"/></Field>
<Field label="Email" required error="Ingresá un email válido"><Input placeholder="vos@email.com"/></Field>
<Field label="Mensaje" valid><Textarea placeholder="Contanos brevemente..."/></Field>
<Checkbox label="Acepto la política de privacidad" defaultChecked/>
<Radio label="Modalidad presencial" name="m" defaultChecked/>
<Toggle label="Recordatorios por WhatsApp" checked={on} onChange={e=>setOn(e.target.checked)}/>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
