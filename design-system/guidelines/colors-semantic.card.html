<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:16px;background:var(--c-white);font-family:var(--font-sans);">
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;">
<div class="swatch" onclick="navigator.clipboard&&navigator.clipboard.writeText('#6E8B76')" style="cursor:pointer"><div class="chip-color" style="background:#6E8B76"></div><div class="meta"><div class="nm">Success</div><div class="role">Confirmaciones, validación</div><div class="hex">#6E8B76</div></div></div>
<div class="swatch" onclick="navigator.clipboard&&navigator.clipboard.writeText('#A6513E')" style="cursor:pointer"><div class="chip-color" style="background:#A6513E"></div><div class="meta"><div class="nm">Error</div><div class="role">Errores, cancelaciones</div><div class="hex">#A6513E</div></div></div>
<div class="swatch" onclick="navigator.clipboard&&navigator.clipboard.writeText('#6E7E8C')" style="cursor:pointer"><div class="chip-color" style="background:#6E7E8C"></div><div class="meta"><div class="nm">Info</div><div class="role">Notas informativas</div><div class="hex">#6E7E8C</div></div></div>
</div></body></html>
